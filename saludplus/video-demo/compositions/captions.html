  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap on-dark"><span>Esto es SaludPlus, un sistema para organizar la admisión,</span></div>
    <div id="cap-1" class="cap on-dark"><span>la espera y la atención en un centro médico.</span></div>
    <div id="cap-2" class="cap on-dark"><span>Ordena la llegada de los pacientes,</span></div>
    <div id="cap-3" class="cap on-dark"><span>reduce confusiones y facilita el seguimiento de cada atención.</span></div>
    <div id="cap-4" class="cap"><span>SaludPlus ofrece cinco perfiles.</span></div>
    <div id="cap-5" class="cap"><span>El Tótem de entrada, para registrarse al llegar.</span></div>
    <div id="cap-6" class="cap"><span>Recepción, para la admisión.</span></div>
    <div id="cap-7" class="cap"><span>Profesional, para la cola y la consulta.</span></div>
    <div id="cap-8" class="cap"><span>Pacientes, la pantalla de la sala de espera.</span></div>
    <div id="cap-9" class="cap"><span>Y Administrador, con la actividad del centro.</span></div>
    <div id="cap-10" class="cap"><span>Empezamos por el tótem del hall de entrada.</span></div>
    <div id="cap-11" class="cap"><span>El paciente indica si tiene un turno</span></div>
    <div id="cap-12" class="cap"><span>programado o si necesita atención sin cita.</span></div>
    <div id="cap-13" class="cap"><span>Después ingresa su DNI.</span></div>
    <div id="cap-14" class="cap"><span>Acá usamos un documento ficticio de la agenda de demostración.</span></div>
    <div id="cap-15" class="cap"><span>Al confirmar la llegada, el sistema emite el número de turno:</span></div>
    <div id="cap-16" class="cap"><span>A-164.</span></div>
    <div id="cap-17" class="cap"><span>El ticket se puede imprimir,</span></div>
    <div id="cap-18" class="cap"><span>y el paciente queda incorporado a la fila de recepción.</span></div>
    <div id="cap-19" class="cap"><span>Recepción ve a quienes se registraron en el tótem,</span></div>
    <div id="cap-20" class="cap"><span>por orden de llegada.</span></div>
    <div id="cap-21" class="cap"><span>Con «Llamar al siguiente», aparecen los datos del paciente,</span></div>
    <div id="cap-22" class="cap"><span>la cobertura y el turno.</span></div>
    <div id="cap-23" class="cap"><span>Al confirmar el pago,</span></div>
    <div id="cap-24" class="cap"><span>el paciente pasa a la sala de espera con el mismo número.</span></div>
    <div id="cap-25" class="cap"><span>«Turnos del día» reúne la agenda completa,</span></div>
    <div id="cap-26" class="cap"><span>con filtros y acciones como marcar presente.</span></div>
    <div id="cap-27" class="cap"><span>Y el ingreso manual suma a un paciente a</span></div>
    <div id="cap-28" class="cap"><span>la cola médica con su DNI y un número nuevo.</span></div>
    <div id="cap-29" class="cap"><span>Ahora, el perfil Profesional: consultorio 3, Cardiología,</span></div>
    <div id="cap-30" class="cap"><span>y los pacientes en espera.</span></div>
    <div id="cap-31" class="cap"><span>La lista se ordena primero por</span></div>
    <div id="cap-32" class="cap"><span>prioridad y después por hora de llegada.</span></div>
    <div id="cap-33" class="cap"><span>En la cola se ve el número de turno, el horario y el estado,</span></div>
    <div id="cap-34" class="cap"><span>sin datos clínicos.</span></div>
    <div id="cap-35" class="cap"><span>Con «Llamar al siguiente»,</span></div>
    <div id="cap-36" class="cap"><span>el sistema toma al primero de la lista.</span></div>
    <div id="cap-37" class="cap"><span>El llamado abre directamente la consulta del turno A-115.</span></div>
    <div id="cap-38" class="cap"><span>De vuelta en la cola, «Último turno llamado» indica número,</span></div>
    <div id="cap-39" class="cap"><span>consultorio y hora.</span></div>
    <div id="cap-40" class="cap"><span>Y el historial de llamados muestra cada turno con el paciente,</span></div>
    <div id="cap-41" class="cap"><span>la hora y el consultorio.</span></div>
    <div id="cap-42" class="cap"><span>En la pantalla pública aparece el turno llamado,</span></div>
    <div id="cap-43" class="cap"><span>el nombre del paciente y a dónde dirigirse.</span></div>
    <div id="cap-44" class="cap"><span>A la derecha, los últimos llamados.</span></div>
    <div id="cap-45" class="cap"><span>No se publican datos clínicos.</span></div>
    <div id="cap-46" class="cap"><span>Estos controles activan la</span></div>
    <div id="cap-47" class="cap"><span>pantalla completa y el sonido del aviso,</span></div>
    <div id="cap-48" class="cap"><span>desde el ícono del parlante.</span></div>
    <div id="cap-49" class="cap"><span>El sonido puede depender de la configuración del navegador.</span></div>
    <div id="cap-50" class="cap"><span>En la consulta médica,</span></div>
    <div id="cap-51" class="cap"><span>el profesional revisa los datos del paciente,</span></div>
    <div id="cap-52" class="cap"><span>y puede corregirlos y guardarlos.</span></div>
    <div id="cap-53" class="cap"><span>Más abajo están los datos del turno, de solo lectura,</span></div>
    <div id="cap-54" class="cap"><span>y el historial de turnos anteriores.</span></div>
    <div id="cap-55" class="cap"><span>También puede cargar una prescripción y, una vez guardada,</span></div>
    <div id="cap-56" class="cap"><span>imprimirla o prepararla para enviar por mail.</span></div>
    <div id="cap-57" class="cap"><span>Al finalizar, el estado cambia a «Consulta finalizada».</span></div>
    <div id="cap-58" class="cap"><span>Tras un minuto sin actividad,</span></div>
    <div id="cap-59" class="cap"><span>la vista vuelve sola a la cola de pacientes.</span></div>
    <div id="cap-60" class="cap"><span>Y si hace falta, «Reanudar consulta» la vuelve a abrir.</span></div>
    <div id="cap-61" class="cap"><span>En «Finalizados/Ausentes»,</span></div>
    <div id="cap-62" class="cap"><span>el profesional consulta los pacientes de su</span></div>
    <div id="cap-63" class="cap"><span>especialidad que ya fueron atendidos o que no se presentaron.</span></div>
    <div id="cap-64" class="cap"><span>Para cada uno se ve el turno, el motivo,</span></div>
    <div id="cap-65" class="cap"><span>el estado y la hora de finalización.</span></div>
    <div id="cap-66" class="cap"><span>El administrador ve el resumen del centro:</span></div>
    <div id="cap-67" class="cap"><span>pacientes registrados, personas en espera y espera promedio,</span></div>
    <div id="cap-68" class="cap"><span>además de la asistencia del día y la calidad de la red.</span></div>
    <div id="cap-69" class="cap on-dark"><span>SaludPlus conecta admisión,</span></div>
    <div id="cap-70" class="cap on-dark"><span>llamados y atención en un mismo flujo.</span></div>
